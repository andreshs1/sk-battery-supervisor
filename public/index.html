<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Battery Supervisor</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 24px;
      background: #f5f7fa;
      color: #1f2933;
    }

    h1 {
      margin-bottom: 4px;
    }

    .subtitle {
      color: #52606d;
      margin-bottom: 24px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      max-width: 760px;
    }

    .profile {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border: 1px solid #d9e2ec;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 10px;
      cursor: pointer;
      background: #ffffff;
    }

    .profile:hover {
      background: #f0f4f8;
    }

    .profile.active {
      border-color: #0078d4;
      background: #e6f2fb;
    }

    .profile-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .tick {
      font-size: 20px;
      width: 24px;
      color: #0078d4;
    }

    .label {
      font-weight: bold;
      font-size: 16px;
    }

    .details {
      color: #52606d;
      font-size: 14px;
      margin-top: 3px;
    }

    .status-grid {
      display: grid;
      grid-template-columns: 180px 1fr;
      gap: 8px;
      font-size: 15px;
    }

    .key {
      color: #52606d;
    }

    .value {
      font-weight: bold;
    }

    .allowed {
      color: #0b6b3a;
    }

    .blocked {
      color: #b42318;
    }

    button {
      background: #0078d4;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 9px 14px;
      cursor: pointer;
      font-size: 14px;
    }

    button:hover {
      background: #005ea6;
    }

    .error {
      color: #b42318;
      font-weight: bold;
    }

    .small {
      color: #52606d;
      font-size: 13px;
    }
  </style>
</head>

<body>
  <h1>Battery Supervisor</h1>
  <div class="subtitle">Profile-based battery charging management</div>

  <div class="card">
    <h2>Status</h2>
    <div id="status">Loading...</div>
  </div>

  <div class="card">
    <h2>Select Charge Profile</h2>
    <div id="profiles">Loading profiles...</div>
    <p class="small">
      A tick indicates the active profile. Selecting another profile immediately updates the SignalK plugin.
    </p>
  </div>

  <script>
    async function getJson(url) {
      const response = await fetch(url)
      if (!response.ok) {
        throw new Error('HTTP ' + response.status)
      }
      return await response.json()
    }

    async function putJson(url, body) {
      const response = await fetch(url, {
        method: 'PUT',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(body)
      })

      if (!response.ok) {
        const text = await response.text()
        throw new Error(text || 'HTTP ' + response.status)
      }

      return await response.json()
    }

    function formatSoc(value) {
      if (value === null || value === undefined) {
        return 'unknown'
      }

      return Number(value).toFixed(1) + '%'
    }

    function renderStatus(status) {
      const chargeClass = status.chargeEnable ? 'allowed' : 'blocked'
      const chargeText = status.chargeEnable ? 'Charging allowed' : 'Charging blocked'

      document.getElementById('status').innerHTML = `
        <div class="status-grid">
          <div class="key">Active profile</div>
          <div class="value">${status.profileLabel}</div>

          <div class="key">Current SOC</div>
          <div class="value">${formatSoc(status.currentSoc)}</div>

          <div class="key">Start charging at</div>
          <div class="value">${status.minSoc}%</div>

          <div class="key">Stop charging at</div>
          <div class="value">${status.maxSoc}%</div>

          <div class="key">Charge state</div>
          <div class="value ${chargeClass}">${chargeText}</div>

          <div class="key">Reason</div>
          <div class="value">${status.reason}</div>

          <div class="key">SOC input path</div>
          <div>${status.socPath}</div>

          <div class="key">Output path</div>
          <div>${status.outputBasePath}</div>
        </div>
      `
    }

    function renderProfiles(activeProfile, profiles) {
      const container = document.getElementById('profiles')
      container.innerHTML = ''

      profiles.forEach(profile => {
        const isActive = profile.id === activeProfile

        const div = document.createElement('div')
        div.className = 'profile' + (isActive ? ' active' : '')

        div.innerHTML = `
          <div class="profile-left">
            <div class="tick">${isActive ? '✓' : ''}</div>
            <div>
              <div class="label">${profile.label}</div>
              <div class="details">
                ${profile.minSoc}% → ${profile.maxSoc}%
              </div>
            </div>
          </div>
          <button>${isActive ? 'Selected' : 'Select'}</button>
        `

        div.onclick = async () => {
          if (isActive) {
            return
          }

          try {
            await putJson('/plugins/sk-battery-supervisor/profile', {
              profile: profile.id
            })
            await refresh()
          } catch (err) {
            alert('Failed to select profile: ' + err.message)
          }
        }

        container.appendChild(div)
      })
    }

    async function refresh() {
      try {
        const status = await getJson('/plugins/sk-battery-supervisor/status')
        const profileData = await getJson('/plugins/sk-battery-supervisor/profiles')

        renderStatus(status)
        renderProfiles(profileData.activeProfile, profileData.profiles)
      } catch (err) {
        document.getElementById('status').innerHTML =
          '<div class="error">Error loading status: ' + err.message + '</div>'
        document.getElementById('profiles').innerHTML =
          '<div class="error">Error loading profiles</div>'
      }
    }

    refresh()
    setInterval(refresh, 5000)
  </script>
</body>
</html>
